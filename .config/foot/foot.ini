# shell=/usr/bin/sh -c "tmux a || tmux"
shell=/usr/bin/sh -c "tmux list-sessions >/dev/null 2>&1 && [ -n \"$(tmux list-clients 2>/dev/null)\" ] && tmux new-session || tmux attach-session 2>/dev/null || tmux new-session"
# shell=/usr/bin/nu
font=0xProto Nerd Font Mono:size=11
include=/usr/share/foot/themes/selenized-black
[desktop-notifications]
command=notify-send -a ${app-id} -i ${app-id} ${title} ${body}command=notify-send -a ${app-id} -i ${app-id} ${title} ${body}command=notify-send -a ${app-id} -i ${app-id} ${title} ${body}command=notify-send -a ${app-id} -i ${app-id} ${title} ${body}
[scrollback]
lines=100000
[cursor]
style=block
