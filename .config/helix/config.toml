theme = "everforest_dark"

[editor.statusline]
right = ["diagnostics", "selections", "position", "position-percentage"]

[editor]
line-number = "absolute"
mouse = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = true

[keys.normal]
# Quick iteration on config changes
C-o = ":config-open"
C-r = ":config-reload"

