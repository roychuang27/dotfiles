# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur = 0
blur_layer = 0
blur_optimized = 1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=100
animation_duration_open=100
animation_duration_tag=100
animation_duration_close=100
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=0
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_corner=3
ov_tab_mode=0
overviewgappi=5
overviewgappo=30
jump_labels=QWERASDFZXCVHJKL

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=27
cursor_theme=Posy_Cursor_Black_125_175
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=39
repeat_delay=600
numlockon=1
xkb_rules_layout=us
xkb_rules_options=caps:escape  

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=0
tap_and_drag=0
drag_lock=0
trackpad_natural_scrolling=1
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=0
gappiv=0
gappoh=0
gappov=0
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=3
rootcolor=0x201b14ff
bordercolor=0x000000
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
focuscolor=0x33ccffee
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x39c5bbff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:dwindle
tagrule=id:2,layout_name:dwindle
tagrule=id:3,layout_name:dwindle
tagrule=id:4,layout_name:dwindle
tagrule=id:5,layout_name:dwindle
tagrule=id:6,layout_name:dwindle
tagrule=id:7,layout_name:dwindle
tagrule=id:8,layout_name:dwindle
tagrule=id:9,layout_name:dwindle

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER+SHIFT,r,reload_config

# menu and terminal
bind=Super,s,spawn,noctalia msg panel-toggle launcher
bind=super,r,spawn,~/.local/bin/wmenu-run-wrapper
bind=Super,Return,spawn,footclient
bind=Super,w,spawn,brave
# bind=Super,e,spawn,footclient -e yazi
bind=NONE,PRINT,spawn,flameshot gui
bind=SUPER,Backspace,spawn,noctalia msg panel-toggle session
# bind=CTRL+SHIFT,Escape,spawn,footclient -e btop
bind=super,escape,toggle_named_scratchpad,foot-btop,none,footclient --app-id=foot-btop -e btop
bind=super,e,toggle_named_scratchpad,foot-yazi,none,footclient --app-id=foot-yazi -e yazi

# exit
bind=CTRL+ALT,delete,quit
bind=SUPER,q,killclient,

# switch window focus
# bind=Super,Left,focusdir,left
# bind=Super,Right,focusdir,right
# bind=Super,Up,focusdir,up
# bind=Super,Down,focusdir,down
bind=Super,H,focusdir,left
bind=Super,L,focusdir,right
bind=Super,K,focusdir,up
bind=Super,J,focusdir,down

# swap window
bind=SUPER+CTRL,K,exchange_client,up
bind=SUPER+CTRL,J,exchange_client,down
bind=SUPER+CTRL,H,exchange_client,left
bind=SUPER+CTRL,L,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=super,tab,togglejump,
# bind=alt,tab,togglejump,
bind=super,code:66,view,-1
bind=SUPER,v,togglefloating,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER,o,toggleoverlay,
bind=SUPER,z,toggle_scratchpad
bind=super,i,minimized,
bind=super+shift,i,restore_minimized,0

# switch layout
circle_layout=dwindle,deck,vertical_deck,monocle
bind=SUPER,D,dwindle_toggle_current_split
bind=SUPER,t,switch_layout

# Volume
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle

# Microphone mute
bind=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle

# Media playback
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPause,spawn,playerctl pause
bind=NONE,XF86AudioStop,spawn,playerctl stop
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous

# Brightness
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s +2%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 2%-
bind=Super,1,view,1,0
bind=Super,2,view,2,0
bind=Super,3,view,3,0
bind=Super,4,view,4,0
bind=Super,5,view,5,0
bind=Super,6,view,6,0
bind=Super,7,view,7,0
bind=Super,8,view,8,0
bind=Super,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=Super+Shift,1,tagsilent,1,0
bind=Super+Shift,2,tagsilent,2,0
bind=Super+Shift,3,tagsilent,3,0
bind=Super+Shift,4,tagsilent,4,0
bind=Super+Shift,5,tagsilent,5,0
bind=Super+Shift,6,tagsilent,6,0
bind=Super+Shift,7,tagsilent,7,0
bind=Super+Shift,8,tagsilent,8,0
bind=Super+Shift,9,tagsilent,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=SUPER+SHIFT,k,resizewin,+0,-50
bind=SUPER+SHIFT,j,resizewin,+0,+50
bind=SUPER+SHIFT,h,resizewin,-50,+0
bind=SUPER+SHIFT,l,resizewin,+50,+0

bind=SUPER,b,spawn,noctalia msg bar-toggle

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Gesture
gesturebind=none,right,3,viewtoleft
gesturebind=none,left,3,viewtoright
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview

# Monitor rule
monitorrule=name:eDP-1,width:1920,height:1080,refresh:144,x:0,y:0,scale:1.5,vrr:0,rr:0

windowrule=appid:flameshot,isfloating:1
windowrule=appid:flameshot,isglobal:1
windowrule=appid:flameshot,isoverlay:1
windowrule=appid:flameshot,width:1920
windowrule=appid:flameshot,height:1080
windowrule=appid:flameshot,noblur:1
windowrule=appid:flameshot,isnoborder:1
windowrule=appid:flameshot,isnoshadow:1

windowrule=appid:foot-fzf-config,isfloating:1,isglobal:1,isoverlay:1,width:1080,height:200,offsetx:50,offsety:0,noblur:1,isnoborder:1,isnoshadow:1,no_force_center:1

windowrule=isnamedscratchpad:1,width:1280,height:800,appid:foot-btop
windowrule=isnamedscratchpad:1,width:1280,height:800,appid:foot-yazi

env=DISPLAY,:11
exec-once=xwayland-satellite :11
env=QT_QPA_PLATFORMTHEME,qt6ct
env=XDG_CURRENT_DESKTOP,wlroots
env=XDG_SESSION_DESKTOP,wlroots
env=XDG_SESSION_TYPE,wayland
env=TERMINAL,footclient
env=EDITOR,helix

exec-once=flameshot
exec-once=fcitx5 -d
exec-once=jamesdsp -t
exec-once=solaar -w hide
exec-once=noctalia
exec-once=foot --server
