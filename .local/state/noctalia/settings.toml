[plugin_settings."ezequiel/mango_layouts"]
panel_open_near_click = true
panel_position = "auto"

[plugins]
enabled = [ "ezequiel/mango_layouts" ]

[shell]
avatar_path = "/home/roychuang/Pictures/うれしい～_129479431.jpg"
popup_shadows = false
screen_time_enabled = true
settings_show_advanced = true

    [shell.panel]
    control_center_placement = "floating"
    list_item_background = true
    shadow = false
    wallpaper_placement = "floating"

    [shell.session]
    grid_columns = 4

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

[theme]
community_palette = "Ayu Blue"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "mango", "qt" ]
    community_ids = [ "papirus-icons" ]

[wallpaper.default]
path = "/home/roychuang/Pictures/Wallpapers/pikasonic_fa_wall_paper.png"

[wallpaper.last]
path = "/home/roychuang/Pictures/Wallpapers/pikasonic_fa_wall_paper.png"

[wallpaper.monitors.eDP-1]
path = "/home/roychuang/Pictures/Wallpapers/pikasonic_fa_wall_paper.png"

[widget.active_window]
font_weight = 600

[widget.brightness]
show_label = false

[widget.btn]
type = "ezequiel/mango_layouts:btn"

[widget.clock]
font_weight = 700
format = "%a %D %H:%M"

[widget.control-center]
glyph = "navigation"

[widget.lock_keys]
hide_when_off = true

[widget.media]
album_art_only = true
capsule_radius = "auto"
hide_when_no_media = true
max_length = 150

[widget.network]
show_label = false

[widget.workspaces]
focused_output_only = true
hide_when_empty = true
style = "focus_hint"