config_version = 13

[audio]
enable_overdrive = true
enable_sounds = true

[bar.default]
capsule_opacity = 0.39999999105930328
concave_edge_corners = false
end = [
    "tray",
    "notifications",
    "caffeine",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "session"
]
font_family = "Noto Sans CJK TC"
margin_ends = 0
padding = 20
radius = 0
shadow = false
start = [ "launcher", "wallpaper", "btn", "workspaces", "active_window" ]
thickness = 30

[brightness]
enable_ddcutil = true
minimum_brightness = 0.28999999351799488

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
auto_hide = true
icon_size = 30
item_spacing = 0
main_axis_padding = 31
pinned = [ "brave-browser", "kitty" ]
reserve_space = false
show_dots = true

[hooks]
started = "noctalia msg bluetooth-disable"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 300.0

[location]
address = "Taipei, Taiwan"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@WL-1", "lockscreen-login-box@winit", "lockscreen-login-box@eDP-1" ]

